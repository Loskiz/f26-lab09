name: f26-lab09

services:
  api:
    build: .
    expose:
      - "8080"
    deploy:
      replicas: 2

  proxy:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  k6:
    image: grafana/k6:2.3.0
    profiles: [load]
    working_dir: /scripts
    volumes:
      - ./load:/scripts:ro
